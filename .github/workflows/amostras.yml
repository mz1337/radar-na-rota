name: Amostras de voz

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  amostras:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar os modelos de voz (CPU)
        timeout-minutes: 25
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts piper-tts

      - name: Gerar as amostras
        timeout-minutes: 60
        run: python pipeline/amostras_voz.py --saida amostras

      - name: Guardar no repositório e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amostras
          git commit -m "Amostras de voz" || echo "nada mudou"
          git push
          gh workflow run radares.yml --ref main
